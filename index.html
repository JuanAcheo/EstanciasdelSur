/* flatten spaces into slides */
const imgs=id=>[].concat(IMG[id]||[]);

SPACES.forEach(([cat,items])=>items.forEach(([id,name])=>S.push({id,cat,name})));
/* Espacios 02 */
const SPACES2=[['e2_0','Exterior'],['e2_1','Exterior'],['e2_2','Exterior'],['e2_3','Exterior']],E2=S.length+1;
SPACES2.forEach(([id,name])=>S.push({id,cat:'Espacios 02',name}));
const TOT=S.length+2+REL.length,R0=S.length+2;

const card=()=>`<aside class="card glass"><button class="pill" data-open="plan">Planimetría</button><button class="pill round" data-next aria-label="Siguiente">${down}</button></aside>`;
let h=`<section class="slide hero"><img alt="Estancias del Sur, vista exterior" src="${HERO}"><div class="shade"></div><div class="foot"><div class="cap"><span class="eyebrow">Proyecto</span><h1>Estancias del Sur</h1><div class="acts"><button class="pill round" data-next aria-label="Ver espacios">${down}</button></div></div></div></section>`;
S.forEach((s,i)=>{h+=`<section class="slide">${imgs(s.id).map((u,k,a)=>`<img${a.length>1?` class="g${k?'':' on'}"`:''} alt="${s.name}${a.length>1?' '+(k+1):''}" data-src="${u}">`).join('')}${imgs(s.id).length>1?`<button class="garr prv glass" data-gp="-1" aria-label="Imagen anterior">‹</button><button class="garr nxt glass" data-gp="1" aria-label="Imagen siguiente">›</button>`:''}<div class="shade"></div><div class="foot"><div class="cap"><span class="idx">${String(i+2).padStart(2,'0')} / ${TOT}</span><h2>${s.name}</h2>${imgs(s.id).length>1?`<div class="dots">${imgs(s.id).map((_,k)=>`<button data-gi="${k}" aria-label="Ver imagen ${k+1}"${k?'':' class="on"'}></button>`).join('')}</div>`:''}</div>${card()}</div></section>`});

/* sección Referencias */
h+=`<section class="slide refs"><div class="rscroll" id="rscroll"><div class="rgrid">${REF.map((r,i)=>`<button data-ref="${i}" aria-label="Ver referencia ${i+1}"><img src="${r[0]}" width="${r[1]}" height="${r[2]}" alt="Referencia ${i+1}" loading="lazy" decoding="async"><span>${String(i+1).padStart(2,'0')}</span></button>`).join('')}</div></div><div class="rhead"><div class="cap"><span class="idx">${String(S.length+2).padStart(2,'0')} / ${TOT}</span><h2>Referencias</h2></div></div></section>`;

function closeSubs(except){$$('.mitem',$('#menu')).forEach(m=>{if(m!==except)m.classList.remove('open')})}

const sec=$$('.slide'),tk=$('#ticks'),menu=$('#menu'),esp=$('#esp');
sec.forEach((_,i)=>{tk.insertAdjacentHTML('beforeend',`<button data-go="${i}" aria-label="Ir a la imagen ${i+1}"><span></span></button>`)});
let idx=0,busy=false;sec[0].classList.add('cur');
function update(){document.documentElement.classList.toggle('on-hero',idx===0);{const hv=$('.hero>video');if(hv){if(idx!==0)hv.pause();else if(document.documentElement.classList.contains('ready'))hv.play().catch(()=>{})}}$$('#ticks button').forEach((b,i)=>b.classList.toggle('on',i===idx));
 $$('.menu [data-idx]').forEach(b=>b.classList.toggle('on',idx>=+b.dataset.idx&&idx<=+(b.dataset.end||b.dataset.idx)))}
function show(n){n=(n+sec.length)%sec.length;if(busy||n===idx)return;busy=true;const p=sec[idx],c=sec[n];
 p.classList.remove('cur','enter');p.classList.add('prev');c.classList.add('cur','enter');idx=n;update();hydN(n);
 setTimeout(()=>{p.classList.remove('prev');c.classList.remove('enter');busy=false},1550)}
update();

/* relevamiento: en pantallas horizontales las fotos verticales van de a dos; en verticales, de a una */
let relPair=null;
const rcell=p=>`<div class="rc"><img class="bg" src="${p[1]}" alt="" aria-hidden="true"><img class="fg" data-src="${p[0]}" alt="" decoding="async"></div>`;
function relCnt(sl){const fr=$$('.rf',sl),c=Math.max(0,fr.findIndex(f=>f.classList.contains('on'))),n=REL[+sl.dataset.rel][1].length,a=+fr[c].dataset.a,b=+fr[c].dataset.b;$('.rcount',sl).textContent=(a===b?a+1:(a+1)+'–'+(b+1))+' / '+n+' fotos'}
function relBuild(){const pair=innerWidth>innerHeight*1.05;if(pair===relPair)return;relPair=pair;
 $$('.slide.rel').forEach(sl=>{const ph=REL[+sl.dataset.rel][1],old=$('.rf.on',sl),keep=old?+old.dataset.a:0,fr=[];
  for(let i=0;i<ph.length;i+=pair?2:1){const b=pair?Math.min(i+1,ph.length-1):i;fr.push([i,b])}
  let cur=fr.findIndex(([a,b])=>keep>=a&&keep<=b);if(cur<0)cur=0;
  $('.rstage',sl).innerHTML=fr.map(([a,b],j)=>`<div class="rf g${j===cur?' on':''}" data-a="${a}" data-b="${b}">${rcell(ph[a])}${b!==a?rcell(ph[b]):''}</div>`).join('');
  $$('.rf',sl).forEach(f=>{$$('.fg',f).forEach((im,q)=>im.alt=REL[+sl.dataset.rel][0]+', foto '+(+f.dataset.a+q+1))});
  const one=fr.length<2;$$('.garr',sl).forEach(b=>b.style.display=one?'none':'');
  $('.dots',sl).innerHTML=one?'':fr.map((_,j)=>`<button data-gi="${j}" aria-label="Ver foto ${j+1}"${j===cur?' class="on"':''}></button>`).join('');
  relCnt(sl)})}
function hydN(n){[n,n+1,n-1].forEach(k=>{const s=sec[(k+sec.length)%sec.length];if(s)$$('img[data-src]',s).forEach(i=>{i.src=i.dataset.src;i.removeAttribute('data-src')})})}
relBuild();hydN(0);addEventListener('resize',()=>{relBuild();hydN(idx)});
/* menú Relevamiento */
const relmenu=$('#relmenu'),relbtn=$('#relbtn');
relmenu.innerHTML=REL.map(([n,ph],k)=>`<div class="mitem"><button class="mhead" data-idx="${R0+k}">${n}<span class="arrow">${ph.length}</span></button></div>`).join('');
const setRel=o=>{relmenu.classList.toggle('open',o);relbtn.setAttribute('aria-expanded',o)};
relbtn.addEventListener('click',()=>{const o=!relmenu.classList.contains('open');setMenu(false);setRel(o)});
esp.addEventListener('click',()=>setRel(false));
document.addEventListener('click',e=>{if(!e.target.closest('#reldd')||e.target.closest('#relmenu [data-idx]'))setRel(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')setRel(false)});
/* scroll interno de Referencias: no cambia de slide salvo en los extremos */
{const rs=$('#rscroll');
 rs.addEventListener('wheel',e=>{const top=rs.scrollTop<=0&&e.deltaY<0,bot=rs.scrollTop+rs.clientHeight>=rs.scrollHeight-2&&e.deltaY>0;if(!top&&!bot)e.stopPropagation()},{passive:true});
 let sy=0;rs.addEventListener('touchstart',e=>{sy=e.touches[0].clientY;e.stopPropagation()},{passive:true});
 rs.addEventListener('touchend',e=>{const d=sy-e.changedTouches[0].clientY,top=rs.scrollTop<=0&&d<-50,bot=rs.scrollTop+rs.clientHeight>=rs.scrollHeight-2&&d>50;if(!top&&!bot)e.stopPropagation()},{passive:true})}
/* lightbox */
let lbi=0;
function lbShow(n){lbi=(n+REF.length)%REF.length;$('#lbimg').src=REF[lbi][0];$('#lbimg').alt='Referencia '+(lbi+1);$('#lbc').textContent=(lbi+1)+' / '+REF.length}
document.addEventListener('click',e=>{const t=e.target.closest('[data-ref]');if(t){lbShow(+t.dataset.ref);openM('lb',t);return}
 if(e.target.closest('#lbp'))lbShow(lbi-1);else if(e.target.closest('#lbn'))lbShow(lbi+1);else if(e.target===$('#lb'))closeM()});
document.addEventListener('keydown',e=>{if(!$('#lb').classList.contains('open'))return;if(e.key==='ArrowRight')lbShow(lbi+1);if(e.key==='ArrowLeft')lbShow(lbi-1)});
let lx=null;$('#lb').addEventListener('touchstart',e=>{lx=e.touches[0].clientX},{passive:true});
$('#lb').addEventListener('touchend',e=>{if(lx===null)return;const d=lx-e.changedTouches[0].clientX;lx=null;if(Math.abs(d)>50)lbShow(lbi+(d>0?1:-1))},{passive:true});
const setMenu=o=>{menu.classList.toggle('open',o);esp.setAttribute('aria-expanded',o);if(!o)closeSubs(null)};
esp.addEventListener('click',()=>setMenu(!menu.classList.contains('open')));
document.addEventListener('click',e=>{
 if(!e.target.closest('.dd'))setMenu(false);
 const t=e.target.closest('[data-go],[data-open],[data-close],[data-next],[data-idx],[data-sub],[data-plan]');if(!t)return;
 if(t.dataset.sub){const mi=t.closest('.mitem'),was=mi.classList.contains('open');closeSubs(null);mi.classList.toggle('open',!was)}
 else if(t.dataset.idx!==undefined){setMenu(false);show(+t.dataset.idx)}
 else if(t.dataset.go!==undefined)show(+t.dataset.go);
 else if(t.dataset.next!==undefined)show(idx+1);
 else if(t.dataset.plan)setPlan(t.dataset.plan);
 else if(t.dataset.open){setMenu(false);openM(t.dataset.open,t)}
 else closeM();
});
let wl=0,ty=null;
addEventListener('wheel',e=>{if($('.modal.open'))return;const n=Date.now();if(Math.abs(e.deltaY)<20||n-wl<1300)return;wl=n;show(idx+(e.deltaY>0?1:-1))},{passive:true});
addEventListener('touchstart',e=>{ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{if(ty===null||$('.modal.open'))return;const d=ty-e.changedTouches[0].clientY;ty=null;if(Math.abs(d)>50)show(idx+(d>0?1:-1))},{passive:true});
$$('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeM()}));
let last=null;
function openM(id,from){closeM(true);if(id==='plan'&&!$('#pimg'))setPlan('baja');const m=$('#'+id);m.classList.add('open');last=from;setTimeout(()=>$('.x',m).focus(),50)}
function closeM(q){$$('.modal.open').forEach(m=>m.classList.remove('open'));if(!q&&last)last.focus()}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeM();setMenu(false);return}
 if($('.modal.open')||e.target.matches('input,textarea'))return;
 if(['ArrowDown','ArrowRight','PageDown'].includes(e.key))show(idx+1);
 if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key))show(idx-1)});


/* galería interna de cada espacio (si tiene más de una imagen) */
function gal(slide,n){const g=$$('.g',slide);if(g.length<2)return;let c=g.findIndex(i=>i.classList.contains('on'));n=(n+g.length)%g.length;
 g.forEach((i,k)=>i.classList.toggle('on',k===n));$$('.dots button',slide).forEach((b,k)=>b.classList.toggle('on',k===n));if(slide.classList.contains('rel'))relCnt(slide)}
const galStep=d=>{const sl=sec[idx];const g=$$('.g',sl);if(g.length<2)return;gal(sl,g.findIndex(i=>i.classList.contains('on'))+d)};
document.addEventListener('click',e=>{const t=e.target.closest('[data-gp],[data-gi]');if(!t)return;const sl=t.closest('.slide');
 if(t.dataset.gp)galStep(+t.dataset.gp);else gal(sl,+t.dataset.gi)});
let tx=null,ty0=null;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty0=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{if(tx===null||$('.modal.open'))return;const dx=tx-e.changedTouches[0].clientX,dy=ty0-e.changedTouches[0].clientY;tx=null;
 if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)galStep(dx>0?1:-1)},{passive:true});

/* plan tabs */
const Z={s:1,x:0,y:0,min:1,max:12};
function zApply(){const f=$('#pframe'),i=$('#pimg');if(!i)return;const w=f.clientWidth,h=f.clientHeight;
 Z.s=Math.min(Z.max,Math.max(Z.min,Z.s));Z.x=Math.min(0,Math.max(w-w*Z.s,Z.x));Z.y=Math.min(0,Math.max(h-h*Z.s,Z.y));
 i.style.transform=`translate(${Z.x}px,${Z.y}px) scale(${Z.s})`}
function zoomAt(k,cx,cy){const ns=Math.min(Z.max,Math.max(Z.min,Z.s*k)),r=ns/Z.s;Z.x=cx-(cx-Z.x)*r;Z.y=cy-(cy-Z.y)*r;Z.s=ns;zApply()}
function zReset(){Z.s=1;Z.x=0;Z.y=0;zApply()}
function zInit(f){
 const pts=new Map();let last=null;
 const rel=e=>{const r=f.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
 const hint=()=>{const h=$('.zhint',f);if(h)h.style.opacity=0};
 f.addEventListener('wheel',e=>{e.preventDefault();hint();const[cx,cy]=rel(e);zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?.01:.0018)),cx,cy)},{passive:false});
 f.addEventListener('pointerdown',e=>{if(e.target.closest('.zctl'))return;f.setPointerCapture(e.pointerId);pts.set(e.pointerId,rel(e));last=null;hint()});
 f.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const prev=pts.get(e.pointerId),cur=rel(e);
  if(pts.size===1){Z.x+=cur[0]-prev[0];Z.y+=cur[1]-prev[1];pts.set(e.pointerId,cur);zApply()}
  else if(pts.size===2){const o=[...pts.entries()].find(([id])=>id!==e.pointerId)[1];
   const d0=Math.hypot(prev[0]-o[0],prev[1]-o[1]),d1=Math.hypot(cur[0]-o[0],cur[1]-o[1]);
   const m0=[(prev[0]+o[0])/2,(prev[1]+o[1])/2],m1=[(cur[0]+o[0])/2,(cur[1]+o[1])/2];
   Z.x+=m1[0]-m0[0];Z.y+=m1[1]-m0[1];pts.set(e.pointerId,cur);if(d0>0)zoomAt(d1/d0,m1[0],m1[1]);else zApply()}});
 const up=e=>{pts.delete(e.pointerId)};f.addEventListener('pointerup',up);f.addEventListener('pointercancel',up);
 f.addEventListener('dblclick',e=>{if(e.target.closest('.zctl'))return;const[cx,cy]=rel(e);if(Z.s>1.05)zReset();else zoomAt(3,cx,cy)});
 $('#zin').onclick=()=>zoomAt(1.5,f.clientWidth/2,f.clientHeight/2);
 $('#zout').onclick=()=>zoomAt(1/1.5,f.clientWidth/2,f.clientHeight/2);
 $('#zrst').onclick=zReset}
addEventListener('resize',zApply);
function setPlan(k){
 $$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.plan===k));
 const src=PLANS[k],frame=$('#pframe'),dl=$('#pdlbtn'),label=k==='baja'?'Planta Baja':'Planimetría',img=IMGS[k];
 $('#pcap').textContent='';
 if(img){frame.innerHTML=`<img id="pimg" src="${img}" alt="${k==='baja'?'Planimetría '+label:label}" draggable="false"><div class="zctl"><button id="zin" aria-label="Acercar">+</button><button id="zout" aria-label="Alejar">−</button><button id="zrst" aria-label="Restablecer" style="font-size:.8rem">⤢</button></div><div class="zhint">Scroll o pellizcá para hacer zoom · arrastrá para moverte</div>`;zInit(frame);zReset()}
 else frame.innerHTML=`<p class="pempty">Todavía no se subió el PDF de ${label}. Cuando lo mandes, va a aparecer acá.</p>`;
 if(src){dl.removeAttribute('aria-disabled');dl.href=src;dl.download=k==='baja'?'Planimetria_planta_baja.pdf':'Planimetria_techos.pdf'}
 else{dl.setAttribute('aria-disabled','true');dl.removeAttribute('href')}
}

/* preloader */
const done=()=>{if(done.d)return;done.d=true;$('#pre').classList.add('done');document.documentElement.classList.remove('load');document.documentElement.classList.add('ready');
 setTimeout(()=>{const hv=$('.hero>video');if(hv){hv.currentTime=0;hv.play().catch(()=>{})}const pv=$('#pre>video');if(pv)pv.pause()},900)};
document.documentElement.classList.add('load');
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
const setP=p=>{const e=Math.max(0,Math.min(1,p));$('#n').textContent=Math.round(e*100);$('#bar').style.width=e*100+'%'};
function timerLoad(){const T=rm?1:1900,t0=performance.now();(function step(t){const p=Math.min(1,(t-t0)/T),e=1-Math.pow(1-p,3);setP(e);p<1?requestAnimationFrame(step):setTimeout(done,rm?0:350)})(t0)}
/* la carga acompaña al video: 0% al empezar, 100% cuando termina */
(function(){
 const pre=$('#pre'),li=$('#logoIntro');
 let pv=null,started=false,fin=false,introDone=false,bad=false;
 if(!rm){pv=document.createElement('video');pv.src=PREV;pv.muted=true;pv.playsInline=true;pv.setAttribute('playsinline','');pv.preload='auto';pv.setAttribute('aria-hidden','true');pre.prepend(pv);
  pv.addEventListener('error',()=>{bad=true;if(introDone&&!started&&!fin){fin=true;timerLoad()}})}
 const tick=()=>{if(fin)return;const d=pv.duration||10;setP(pv.currentTime/d);requestAnimationFrame(tick)};
 const finish=()=>{if(fin)return;fin=true;setP(1);setTimeout(done,450)};
 function startVideo(){
  introDone=true;pre.classList.remove('intro');
  if(rm||bad){fin=true;timerLoad();return}
  pre.classList.add('vid');
  pv.addEventListener('playing',()=>{if(started)return;started=true;requestAnimationFrame(tick)});
  pv.addEventListener('ended',finish);
  const pr=pv.play();if(pr&&pr.catch)pr.catch(()=>{if(!started&&!fin){fin=true;timerLoad()}});
  setTimeout(()=>{if(!started&&!fin){fin=true;timerLoad()}},4000)}
 /* 1) el logo entra suave, 2) se sostiene, 3) sale, 4) arranca el video del croquis */
 requestAnimationFrame(()=>requestAnimationFrame(()=>{li.classList.add('show');
  setTimeout(()=>{li.classList.remove('show');setTimeout(startVideo,rm?0:1000)},rm?1500:2500)}));
})();
</script>
